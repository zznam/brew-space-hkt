<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Tại Nếp: xác nhận bàn, chọn dịch vụ, đối chiếu gói trả trước, sử dụng và checkout."
    />
    <title>Nếp — Buổi ghé của bạn</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="mobile.css" />
    <link rel="stylesheet" href="journey.css" />
    <link rel="icon" href="data:," />
    <script src="services.js" defer></script>
    <script src="journey.js" defer></script>
    <script src="shared.js" defer></script>
    <script src="service-ui.js" defer></script>
    <script src="customer.js" defer></script>
  </head>
  <body class="customer-page mobile-app journey-app">
    <a class="skip-link" href="#main">Đến nội dung chính</a>
    <header class="customer-header phone-header">
      <a href="index.html" class="wordmark" aria-label="Nếp — chọn giao diện"
        >nếp</a
      >
      <div class="phone-venue">
        <strong>Nếp · Quận 3</strong
        ><span>Cafe & coworking · chi nhánh mẫu</span>
      </div>
      <button
        class="icon-button"
        id="customer-support"
        aria-label="Gọi nhân viên hỗ trợ"
      >
        <span data-icon="bell"></span>
      </button>
    </header>
    <main id="main" class="customer-main" tabindex="-1">
      <div class="journey-topline">
        <span>BẢN MẪU · KHÔNG THU TIỀN</span
        ><span id="visit-context">Chưa xác nhận bàn</span>
      </div>
      <div id="journey-progress" aria-label="Các bước của buổi ghé"></div>
      <div id="customer-content"></div>
      <p
        class="form-error journey-error"
        id="journey-error"
        role="alert"
        hidden
      ></p>
    </main>
    <footer class="phone-footer">
      <span>Dữ liệu mẫu lưu trên trình duyệt</span
      ><a href="operations.html" class="text-link"
        >Màn nhân viên <span data-icon="external"></span
      ></a>
    </footer>
    <nav class="phone-nav customer-nav" aria-label="Điều hướng khách">
      <button class="is-active" data-customer-tab="visit" aria-current="page">
        <span data-icon="grid"></span><span>Buổi ghé</span></button
      ><button data-customer-tab="loyalty">
        <span data-icon="cup"></span><span>Điểm & gói</span></button
      ><button data-customer-tab="profile">
        <span data-icon="users"></span><span>Cá nhân</span>
      </button>
    </nav>
    <dialog
      id="customer-dialog"
      class="phone-sheet"
      aria-labelledby="customer-dialog-title"
    >
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="dialog-heading">
        <h2 id="customer-dialog-title"></h2>
        <button
          class="icon-button"
          id="close-customer-dialog"
          aria-label="Đóng cửa sổ"
        >
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="customer-dialog-body"></div>
    </dialog>
    <div id="notice" class="notice" role="status" hidden></div>
  </body>
</html>
